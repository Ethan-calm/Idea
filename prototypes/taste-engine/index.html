<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taste Engine</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #e4e2dd; --good: #1f9d55; --bad: #d64545; --accent: #4b5cf0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1e1e22; --ink: #f2f2f4; --muted: #9a9aa2;
      --line: #2e2e34; --good: #3ccf7d; --bad: #f06b6b; --accent: #8b97ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { padding: 20px 16px 4px; max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 20px; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .stage-wrap { width: 100%; min-height: 320px; display: grid; place-items: center;
    background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 20px 20px;
    border-radius: 12px; padding: 24px 12px; }
  .btns { display: flex; gap: 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 10px 18px; border-radius: 999px; cursor: pointer; }
  button.no { border-color: var(--bad); color: var(--bad); }
  button.yes { border-color: var(--good); color: var(--good); }
  button:hover { filter: brightness(0.97); }
  .hint { color: var(--muted); font-size: 13px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .bar { display: grid; grid-template-columns: 120px 1fr 44px; gap: 8px; align-items: center;
    font-size: 13px; margin: 4px 0; }
  .track { position: relative; height: 8px; background: var(--line); border-radius: 4px; }
  .track i { position: absolute; top: 0; height: 100%; border-radius: 4px; }
  .track::after { content: ""; position: absolute; left: 50%; top: -2px; width: 1px; height: 12px; background: var(--muted); }
  .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .report { margin: 12px 0 0; padding: 12px; border-radius: 10px; background: var(--bg); font-size: 14px; }
  .picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pick { transform-origin: top left; }
  .pick-box { overflow: hidden; height: 120px; border-radius: 8px; background: var(--bg); position: relative; }
  .pick-box > div { position: absolute; left: 6px; top: 6px; transform: scale(0.34); transform-origin: top left; }
  .score { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }
  .stats { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .stats b { color: var(--ink); }
  textarea { width: 100%; min-height: 70px; font: 12px/1.4 ui-monospace, monospace; background: var(--bg);
    color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
  section + section { margin-top: 18px; }

  /* The generated card */
  .card { width: 300px; max-width: 100%; transition: transform .15s; }
  .card.swipe-l { transform: translateX(-40px) rotate(-6deg); opacity: .4; }
  .card.swipe-r { transform: translateX(40px) rotate(6deg); opacity: .4; }
  .card .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .card .title { margin: 6px 0 8px; line-height: 1.2; }
  .card .body { opacity: .8; font-size: 14px; }
  .card .cta { display: inline-block; margin-top: 14px; padding: 8px 14px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>🎯 Taste Engine</h1>
  <p>카드를 좋아요/싫어요로 평가하면, 브라우저 안의 작은 모델이 <b>당신의 디자인 취향</b>을 학습합니다.</p>
</header>
<main>
  <div class="panel stage">
    <div class="stats">
      <span>평가 <b id="n">0</b>회</span>
      <span>모델 정확도(최근 10) <b id="acc">–</b></span>
    </div>
    <div class="stage-wrap" id="stage"></div>
    <div class="btns">
      <button class="no" id="no">← 별로</button>
      <button id="skip">↓ 모르겠음</button>
      <button class="yes" id="yes">좋아 →</button>
    </div>
    <div class="hint">키보드: ← / → / ↓ &nbsp;·&nbsp; 모델 예측: <span id="pred">–</span></div>
  </div>

  <div class="panel">
    <section>
      <h2>당신의 취향 리포트</h2>
      <div id="bars"></div>
      <div class="report" id="report">10번쯤 평가하면 취향이 보이기 시작해요.</div>
    </section>
    <section>
      <h2>후보 300개 중 취향 TOP 3</h2>
      <div class="picks" id="picks"></div>
    </section>
    <section>
      <h2>취향 프롬프트 (생성 AI에 붙여넣기용)</h2>
      <textarea id="prompt" readonly></textarea>
    </section>
  </div>
</main>

<script>
// ---------- design space ----------
const FONTS = [
  { key: "serif", css: 'Georgia, "Times New Roman", "Nanum Myeongjo", serif', label: "세리프" },
  { key: "sans",  css: 'system-ui, -apple-system, "Noto Sans KR", sans-serif', label: "산세리프" },
  { key: "mono",  css: 'ui-monospace, "SFMono-Regular", Menlo, monospace', label: "모노스페이스" },
];
const COPY = [
  ["New", "조용한 생산성", "알림 없이, 해야 할 일만 남기는 앱."],
  ["Beta", "밤새 일하는 에이전트", "자는 동안 큐를 비우고 아침에 브리핑합니다."],
  ["Pro", "취향을 학습하는 디자인", "스와이프 30번이면 충분합니다."],
  ["Launch", "커피 한 잔의 여유", "오늘 마실 원두를 골라드려요."],
];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function randomDesign() {
  return {
    hue: rand(0, 360), sat: rand(0, 1), dark: Math.random() < 0.4,
    radius: rand(0, 28), shadow: rand(0, 1), pad: rand(14, 34),
    font: Math.floor(Math.random() * 3), weight: Math.random() < 0.5 ? 400 : 800,
    titleSize: rand(18, 34), accentShift: pick([0, 30, 150, 180]),
    copy: Math.floor(Math.random() * COPY.length),
  };
}

// features in roughly [-1, 1]
const FEATURES = [
  ["warm",     "따뜻한 색",        d => Math.cos((d.hue - 30) * Math.PI / 180)],
  ["sat",      "채도 높음",        d => d.sat * 2 - 1],
  ["dark",     "다크 모드",        d => d.dark ? 1 : -1],
  ["radius",   "둥근 모서리",      d => d.radius / 14 - 1],
  ["shadow",   "깊은 그림자",      d => d.shadow * 2 - 1],
  ["pad",      "넉넉한 여백",      d => (d.pad - 24) / 10],
  ["serif",    "세리프",           d => d.font === 0 ? 1 : 0],
  ["mono",     "모노스페이스",     d => d.font === 2 ? 1 : 0],
  ["bold",     "굵은 제목",        d => d.weight > 500 ? 1 : -1],
  ["big",      "큰 제목",          d => (d.titleSize - 26) / 8],
  ["contrast", "보색 포인트",      d => d.accentShift >= 150 ? 1 : -1],
];
const featurize = d => [1, ...FEATURES.map(f => f[2](d))]; // bias first

// ---------- render ----------
function cardEl(d) {
  const bgL = d.dark ? 12 + d.sat * 6 : 96 - d.sat * 8;
  const bg = `hsl(${d.hue} ${Math.round(d.sat * 60)}% ${bgL}%)`;
  const ink = d.dark ? `hsl(${d.hue} 20% 94%)` : `hsl(${d.hue} 30% 12%)`;
  const accent = `hsl(${(d.hue + d.accentShift) % 360} ${Math.round(40 + d.sat * 50)}% ${d.dark ? 62 : 46}%)`;
  const [eyebrow, title, body] = COPY[d.copy];
  const el = document.createElement("div");
  el.className = "card";
  el.style.cssText = `background:${bg};color:${ink};border-radius:${d.radius}px;padding:${d.pad}px;
    font-family:${FONTS[d.font].css};
    box-shadow:0 ${2 + d.shadow * 22}px ${4 + d.shadow * 48}px rgba(0,0,0,${0.06 + d.shadow * 0.28});`;
  el.innerHTML = `<div class="eyebrow" style="color:${accent}">${eyebrow}</div>
    <div class="title" style="font-size:${d.titleSize}px;font-weight:${d.weight}">${title}</div>
    <div class="body">${body}</div>
    <span class="cta" style="background:${accent};color:${d.dark ? "#111" : "#fff"};border-radius:${Math.min(d.radius, 999)}px">시작하기</span>`;
  return el;
}

// ---------- model: online logistic regression ----------
const w = new Array(FEATURES.length + 1).fill(0);
const LR = 0.25, L2 = 0.01;
const sigmoid = z => 1 / (1 + Math.exp(-z));
const score = d => sigmoid(featurize(d).reduce((s, x, i) => s + x * w[i], 0));
function train(d, y) {
  const x = featurize(d), p = score(d);
  for (let i = 0; i < w.length; i++) w[i] += LR * ((y - p) * x[i] - (i ? L2 * w[i] : 0));
}
// replay buffer → a few extra passes keep it stable with tiny data
const history = [];
function learn(d, y) {
  history.push([d, y]);
  train(d, y);
  for (let k = 0; k < 3; k++) for (const [hd, hy] of history) train(hd, hy);
}

// ---------- loop ----------
let current, n = 0;
const recent = [];
const $ = id => document.getElementById(id);

function next() {
  // after warm-up: 1/3 exploit (show what model thinks you like), 2/3 explore
  if (n >= 8 && Math.random() < 0.33) {
    current = Array.from({ length: 40 }, randomDesign).sort((a, b) => score(b) - score(a))[0];
  } else current = randomDesign();
  $("stage").replaceChildren(cardEl(current));
  $("pred").textContent = n < 3 ? "학습 중…" : `좋아할 확률 ${Math.round(score(current) * 100)}%`;
}

function rate(y) {
  const card = $("stage").firstChild;
  if (y !== null) {
    recent.push((score(current) > 0.5) === (y === 1));
    if (recent.length > 10) recent.shift();
    learn(current, y);
    n++;
    card.classList.add(y ? "swipe-r" : "swipe-l");
  }
  setTimeout(() => { next(); updateSidebar(); }, y === null ? 0 : 140);
}

function updateSidebar() {
  $("n").textContent = n;
  $("acc").textContent = recent.length >= 5
    ? Math.round(recent.filter(Boolean).length / recent.length * 100) + "%" : "–";

  const max = Math.max(1, ...w.slice(1).map(Math.abs));
  $("bars").innerHTML = FEATURES.map(([, label], i) => {
    const v = w[i + 1], pct = Math.abs(v) / max * 50;
    const left = v >= 0 ? 50 : 50 - pct;
    return `<div class="bar"><span>${label}</span>
      <span class="track"><i style="left:${left}%;width:${pct}%;background:${v >= 0 ? "var(--good)" : "var(--bad)"}"></i></span>
      <span class="num">${v >= 0 ? "+" : ""}${v.toFixed(2)}</span></div>`;
  }).join("");

  const ranked = FEATURES.map(([, label], i) => [label, w[i + 1]])
    .filter(([, v]) => Math.abs(v) > 0.3).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  const likes = ranked.filter(r => r[1] > 0).slice(0, 3).map(r => r[0]);
  const hates = ranked.filter(r => r[1] < 0).slice(0, 3).map(r => r[0]);
  if (n >= 10 && (likes.length || hates.length)) {
    $("report").innerHTML =
      (likes.length ? `당신은 <b>${likes.join(", ")}</b>을(를) 좋아하고` : "뚜렷한 선호는 아직 없고") +
      (hates.length ? `, <b>${hates.join(", ")}</b>은(는) 피하는 편이에요.` : " 싫어하는 건 딱히 없네요.");
  }

  const pool = Array.from({ length: 300 }, randomDesign).map(d => [d, score(d)]).sort((a, b) => b[1] - a[1]);
  $("picks").innerHTML = "";
  for (const [d, s] of pool.slice(0, 3)) {
    const wrap = document.createElement("div");
    const box = document.createElement("div"); box.className = "pick-box";
    const inner = document.createElement("div"); inner.appendChild(cardEl(d)); box.appendChild(inner);
    wrap.appendChild(box);
    wrap.insertAdjacentHTML("beforeend", `<div class="score">${Math.round(s * 100)}%</div>`);
    $("picks").appendChild(wrap);
  }

  const eng = { warm: "warm hues", sat: "saturated colors", dark: "dark mode", radius: "rounded corners",
    shadow: "deep soft shadows", pad: "generous padding", serif: "serif typography", mono: "monospace typography",
    bold: "bold headings", big: "large display headings", contrast: "complementary accent colors" };
  const pos = [], neg = [];
  FEATURES.forEach(([k], i) => { if (w[i + 1] > 0.3) pos.push(eng[k]); else if (w[i + 1] < -0.3) neg.push(eng[k]); });
  $("prompt").value = n < 10 ? "(10번 이상 평가하면 생성됩니다)" :
    `Design a UI component in my taste. Prefer: ${pos.join(", ") || "no strong preference"}. ` +
    `Avoid: ${neg.join(", ") || "nothing in particular"}.`;
}

$("yes").onclick = () => rate(1);
$("no").onclick = () => rate(0);
$("skip").onclick = () => rate(null);
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") rate(1);
  else if (e.key === "ArrowLeft") rate(0);
  else if (e.key === "ArrowDown") rate(null);
});
next(); updateSidebar();
</script>
</body>
</html>
